# .github/workflows/ci.yml
# Pipeline de Integración Continua para MoviBus-Demo.
# Se ejecuta en cada push y pull request hacia main.
# Verifica: instalación de dependencias, typecheck y tests con cobertura.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela ejecuciones previas del mismo commit si llega uno nuevo
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificación de tipos
        run: npm run typecheck

      - name: Pruebas con Jest y cobertura
        run: npm test -- --coverage --ci

      - name: Guardar reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/
          retention-days: 30
          if-no-files-found: warn